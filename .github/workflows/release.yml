name: Release

on:
  push:
    tags:
      - "v*.*.*" # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        type: string
      product_name:
        description: "Displayed application name"
        required: true
        default: "Oppulence Voice"
        type: string
      app_id:
        description: "Unique reverse-DNS application ID; change this when renaming"
        required: true
        default: "engineering.oppulence.voice"
        type: string
      protocol_scheme:
        description: "Unique lowercase deep-link scheme; change this when renaming"
        required: true
        default: "oppulence-voice"
        type: string
      publish_release:
        description: "Publish the GitHub release after every platform build succeeds"
        required: true
        default: true
        type: boolean
      allow_unsigned_release:
        description: "Explicitly allow publishing when Windows or macOS signing secrets are missing"
        required: true
        default: false
        type: boolean
      validate_only:
        description: "Validate inputs, generated configuration, quality checks, and tests without creating a release"
        required: true
        default: false
        type: boolean
      reuse_semantic_release:
        description: "Reuse the existing tag and draft created by semantic-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write # Required for creating releases

env:
  DISTRIBUTION_MANIFEST: distributions/oppulence-voice.json
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  RELEASE_PRODUCT_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.product_name || 'Oppulence Voice' }}
  RELEASE_APP_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.app_id || 'engineering.oppulence.voice' }}
  RELEASE_PROTOCOL_SCHEME: ${{ github.event_name == 'workflow_dispatch' && inputs.protocol_scheme || 'oppulence-voice' }}
  RELEASE_CONFIG_PATH: electron-builder.release.generated.json
  RELEASE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
  RELEASE_WINDOWS_SIGNING_JSON: ${{ vars.RELEASE_WINDOWS_SIGNING_JSON }}
  RELEASE_VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only || false }}
  RELEASE_REUSE_SEMANTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_semantic_release || false }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          MICROSOFT_CALENDAR_CLIENT_ID: ${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          ALLOW_UNSIGNED_RELEASE: ${{ inputs.allow_unsigned_release }}
          WINDOWS_SIGNING_AVAILABLE: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && vars.RELEASE_WINDOWS_SIGNING_JSON != '' }}
          MACOS_SIGNING_AVAILABLE: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_BASE64 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if ! echo "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release version must use semantic version format x.y.z"
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION"
            exit 1
          fi
          if [ "$RELEASE_VALIDATE_ONLY" != "true" ] && [ -z "$MICROSOFT_CALENDAR_CLIENT_ID" ]; then
            echo "::error::MICROSOFT_CALENDAR_CLIENT_ID is required for release builds"
            exit 1
          fi
          release_exists=false
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
            if [ "$RELEASE_REUSE_SEMANTIC" != "true" ]; then
              echo "::error::Release $RELEASE_TAG already exists. Delete the incomplete draft or choose a new version before retrying."
              exit 1
            fi
            if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::Semantic release $RELEASE_TAG must still be a draft before artifact publication."
              exit 1
            fi
          fi

          tag_exists=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && \
             git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tag_exists=true
            if [ "$RELEASE_REUSE_SEMANTIC" != "true" ]; then
              echo "::error::Tag $RELEASE_TAG already exists. Manual releases must use a new version."
              exit 1
            fi
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            TAG_SHA=$(git rev-parse "$RELEASE_TAG^{commit}")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Semantic release tag $RELEASE_TAG points to $TAG_SHA instead of workflow commit $GITHUB_SHA."
              exit 1
            fi
          fi
          if [ "$RELEASE_REUSE_SEMANTIC" = "true" ] && \
             { [ "$release_exists" != "true" ] || [ "$tag_exists" != "true" ]; }; then
            echo "::error::Semantic release handoff requires both an existing draft release and its matching tag."
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && \
             [ "$RELEASE_VALIDATE_ONLY" != "true" ] && \
             [ "$PUBLISH_RELEASE" = "true" ] && \
             [ "$ALLOW_UNSIGNED_RELEASE" != "true" ] && \
             { [ "$WINDOWS_SIGNING_AVAILABLE" != "true" ] || [ "$MACOS_SIGNING_AVAILABLE" != "true" ]; }; then
            echo "::error::Publishing requires complete Windows and macOS signing secrets. Set allow_unsigned_release only when an unsigned public release is intentional."
            exit 1
          fi
          node scripts/prepare-release-config.js
      - name: Run quality checks
        run: npm run quality-check
      - name: Check translations
        run: npm run i18n:check
      - name: Audit dependencies
        run: npm audit
      - name: Build better-sqlite3 for the runner's node
        # --ignore-scripts skips the native build, so DB-backed tests silently
        # skip unless the binding is rebuilt for the CI Node runtime.
        run: npm rebuild better-sqlite3
      - name: Run tests
        run: npm test
        env:
          # keeps require("electron") from throwing when postinstall was skipped
          ELECTRON_OVERRIDE_DIST_PATH: /tmp
          # a skipped DB test here means the rebuild step above is gone: fail instead
          REQUIRE_DB_TESTS: "1"

  prepare-release:
    needs: tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.validate_only != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Reuse semantic draft or create empty draft release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$RELEASE_REUSE_SEMANTIC" = "true" ]; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,url
            exit 0
          fi

          args=(
            "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --title "$RELEASE_PRODUCT_NAME $RELEASE_TAG"
            --draft
          )
          if [ "$EVENT_NAME" = "push" ]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "${args[@]}"

  build-linux:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare release packaging config
        run: node scripts/prepare-release-config.js

      - name: Install platform-specific native binaries
        run: npm install @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --no-save

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: linux-x64-bin-${{ hashFiles('scripts/download-*.js') }}

      - name: Download whisper.cpp binaries
        run: node scripts/download-whisper-cpp.js --current
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download llama-server binaries
        run: node scripts/download-llama-server.js --current
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download sherpa-onnx binaries
        run: node scripts/download-sherpa-onnx.js --current
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download yt-dlp binary
        run: node scripts/download-yt-dlp.js --current

      - name: Download Qdrant binary
        run: node scripts/download-qdrant.js --current
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download meeting AEC helper
        run: node scripts/download-meeting-aec-helper.js --current
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: linux-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: linux-electron-

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libx11-dev libxtst-dev libatspi2.0-dev libglib2.0-dev libpipewire-0.3-dev pkg-config

      - name: Create runtime env
        run: |
          {
            echo "GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}"
            echo "GOOGLE_CALENDAR_CLIENT_SECRET=${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}"
            echo "MICROSOFT_CALENDAR_CLIENT_ID=${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}"
          } >> .env

      - name: Verify PipeWire system audio helper build
        run: |
          npm run compile:linux-system-audio
          # supportsNativeCapture reflects compile-time PipeWire linkage, so this passes on CI runners with no PipeWire daemon (where "ok" is false).
          resources/bin/linux-system-audio-helper probe | grep '"supportsNativeCapture":true'

      - name: Build Application
        run: npm run build:linux -- --publish always --config "$RELEASE_CONFIG_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL || 'https://auth.openwhispr.com' }}
          VITE_OPENWHISPR_API_URL: ${{ vars.VITE_OPENWHISPR_API_URL }}
          VITE_OPENWHISPR_OAUTH_CALLBACK_URL: ${{ vars.VITE_OPENWHISPR_OAUTH_CALLBACK_URL }}

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    env:
      WINDOWS_SIGNING_AVAILABLE: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && vars.RELEASE_WINDOWS_SIGNING_JSON != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci

      - name: Prepare release packaging config
        run: node scripts/prepare-release-config.js
        env:
          RELEASE_UNSIGNED_WINDOWS: ${{ env.WINDOWS_SIGNING_AVAILABLE != 'true' }}

      - name: Install platform-specific native binaries
        run: npm install @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc @tailwindcss/oxide-win32-x64-msvc --no-save

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          # Native helper sources are in the key so source changes cannot
          # restore stale helper binaries from the cache.
          key: windows-x64-bin-${{ hashFiles('scripts/download-*.js', 'resources/windows-system-audio-helper.c', 'resources/windows-mic-listener.c') }}

      - name: Download whisper.cpp binaries
        run: node scripts/download-whisper-cpp.js --current
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download llama-server binaries
        run: node scripts/download-llama-server.js --current
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download sherpa-onnx binaries
        run: node scripts/download-sherpa-onnx.js --current
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download yt-dlp binary
        run: node scripts/download-yt-dlp.js --current

      - name: Download Qdrant binary
        run: node scripts/download-qdrant.js --current
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download meeting AEC helper
        run: node scripts/download-meeting-aec-helper.js --current
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download nircmd.exe
        run: node scripts/download-nircmd.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download windows-fast-paste.exe
        run: node scripts/download-windows-fast-paste.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download windows-key-listener.exe
        run: node scripts/download-windows-key-listener.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Compile windows-mic-listener.exe
        shell: cmd
        run: |
          if not exist resources\bin mkdir resources\bin
          cl /O2 /nologo resources\windows-mic-listener.c /Fe:resources\bin\windows-mic-listener.exe ole32.lib oleaut32.lib

      - name: Download windows-system-audio-helper.exe
        run: node scripts/download-windows-system-audio-helper.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify windows-system-audio-helper.exe
        shell: bash
        run: test -f resources/bin/windows-system-audio-helper.exe

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: windows-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: windows-electron-

      - name: Create runtime env
        shell: bash
        run: |
          {
            echo "GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}"
            echo "GOOGLE_CALENDAR_CLIENT_SECRET=${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}"
            echo "MICROSOFT_CALENDAR_CLIENT_ID=${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}"
          } >> .env

      - name: Build and Sign Application
        shell: bash
        run: |
          publish_mode=always
          if [ "$WINDOWS_SIGNING_AVAILABLE" != "true" ]; then
            echo "::warning::Windows signing secrets are unavailable; building the installer for validation but withholding it from the public release."
            publish_mode=never
          fi
          npm run build:win -- --publish "$publish_mode" --config "$RELEASE_CONFIG_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL || 'https://auth.openwhispr.com' }}
          VITE_OPENWHISPR_API_URL: ${{ vars.VITE_OPENWHISPR_API_URL }}
          VITE_OPENWHISPR_OAUTH_CALLBACK_URL: ${{ vars.VITE_OPENWHISPR_OAUTH_CALLBACK_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  build-macos:
    needs: prepare-release
    runs-on: macos-latest
    env:
      MACOS_SIGNING_AVAILABLE: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_BASE64 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_TEAM_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare release packaging config
        run: node scripts/prepare-release-config.js
        env:
          RELEASE_UNSIGNED_MACOS: ${{ env.MACOS_SIGNING_AVAILABLE != 'true' }}

      - name: Install ffmpeg-static for target architecture
        if: matrix.arch == 'x64'
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: macos-${{ matrix.arch }}-bin-${{ hashFiles('scripts/download-*.js', 'scripts/build-globe-listener.js', 'resources/macos-globe-listener.swift', 'scripts/build-macos-fast-paste.js', 'resources/macos-fast-paste.swift', 'scripts/build-media-remote.js', 'resources/macos-media-remote.swift', 'scripts/build-macos-audio-tap.js', 'resources/macos-audio-tap.swift') }}

      - name: Compile macos-globe-listener binary
        run: npm run compile:globe -- --arch ${{ matrix.arch }}

      - name: Compile macos-fast-paste binary
        run: npm run compile:fast-paste -- --arch ${{ matrix.arch }}

      - name: Compile macos-media-remote binary
        run: npm run compile:media-remote -- --arch ${{ matrix.arch }}

      - name: Compile macos-audio-tap binary
        run: npm run compile:audio-tap -- --arch ${{ matrix.arch }}

      - name: Download whisper.cpp binaries
        run: node scripts/download-whisper-cpp.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download llama-server binaries
        run: node scripts/download-llama-server.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download sherpa-onnx binaries
        run: node scripts/download-sherpa-onnx.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download yt-dlp binary
        run: node scripts/download-yt-dlp.js --current --platform darwin --arch ${{ matrix.arch }}

      - name: Download Qdrant binary
        run: node scripts/download-qdrant.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download meeting AEC helper
        run: node scripts/download-meeting-aec-helper.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: macos-${{ matrix.arch }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: macos-${{ matrix.arch }}-electron-

      - name: Setup macOS Code Signing
        if: env.MACOS_SIGNING_AVAILABLE == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          API_KEY_PATH=$RUNNER_TEMP/api_key.p8
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"

          security create-keychain -p "runner" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "runner" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: -s -k "runner" "$KEYCHAIN_PATH"

          echo "APPLE_API_KEY=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Create runtime env
        run: |
          {
            echo "GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}"
            echo "GOOGLE_CALENDAR_CLIENT_SECRET=${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}"
            echo "MICROSOFT_CALENDAR_CLIENT_ID=${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}"
          } >> .env

      - name: Build Application (${{ matrix.arch }})
        run: npm run build:mac -- --${{ matrix.arch }} --publish always --config "$RELEASE_CONFIG_PATH"
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL || 'https://auth.openwhispr.com' }}
          VITE_OPENWHISPR_API_URL: ${{ vars.VITE_OPENWHISPR_API_URL }}
          VITE_OPENWHISPR_OAUTH_CALLBACK_URL: ${{ vars.VITE_OPENWHISPR_OAUTH_CALLBACK_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.MACOS_SIGNING_AVAILABLE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify packaged macOS native binaries
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # electron-builder names the bundle after the manifest's
          # executableName, not the product name, so those differ whenever a
          # distribution sets both (oppulence-voice.app vs "Oppulence Voice").
          # Take whichever single .app landed in dist/.
          APP_PATH=$(find dist -maxdepth 2 -type d -name "*.app" -print -quit)
          test -n "$APP_PATH" || { echo "Missing packaged .app under dist/"; find dist -maxdepth 2 -name "*.app" -o -maxdepth 1 -type d | head -20; exit 1; }
          echo "Verifying $APP_PATH"
          for bin in macos-audio-tap macos-globe-listener macos-fast-paste macos-mic-listener macos-text-monitor macos-media-remote; do
            test -x "$APP_PATH/Contents/Resources/bin/$bin" || { echo "Missing in bundle: $bin"; exit 1; }
          done
          test -x "$APP_PATH/Contents/Resources/bin/MediaRemoteAdapter.framework/Versions/A/MediaRemoteAdapter" || { echo "Missing in bundle: MediaRemoteAdapter.framework"; exit 1; }
          test -f "$APP_PATH/Contents/Resources/bin/mediaremote-adapter.pl" || { echo "Missing in bundle: mediaremote-adapter.pl"; exit 1; }
          node scripts/verify-macos-parakeet.js "$APP_PATH"

          if [ "$MACOS_SIGNING_AVAILABLE" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            SIGNATURE_DETAILS=$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)
            grep -F "Authority=Developer ID Application:" <<< "$SIGNATURE_DETAILS"
            grep -F "TeamIdentifier=$APPLE_TEAM_ID" <<< "$SIGNATURE_DETAILS"
          fi

      - name: Upload arch-specific update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/latest-mac.yml "dist/latest-${{ matrix.arch }}-mac.yml"
          gh release upload "$RELEASE_TAG" "dist/latest-${{ matrix.arch }}-mac.yml" --clobber

      - name: Cleanup Certificates
        if: always() && env.MACOS_SIGNING_AVAILABLE == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12"
          rm -f "$RUNNER_TEMP/api_key.p8"

  publish-release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_PRODUCT_NAME $RELEASE_TAG" \
            --draft=false \
            --latest
