name: DES-165 whisper.cpp CPU RCA

on:
  workflow_dispatch:
    inputs:
      sidecar_version:
        description: Released OpenWhispr whisper.cpp sidecar to benchmark
        required: true
        default: "0.0.8"
        type: choice
        options:
          - "0.0.8"
          - "0.0.6"
  pull_request:
    types: [labeled]

env:
  SIDECAR_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.sidecar_version || github.event.label.name == 'des-165-run-0.0.6' && '0.0.6' || '0.0.8' }}

permissions:
  contents: read

jobs:
  ubuntu-cpu:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/des-165-whisper-cpu-rca' &&
      (github.event.label.name == 'des-165-run-0.0.8' ||
      github.event.label.name == 'des-165-run-0.0.6'))
    name: Ubuntu 22.04 x64 CPU
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run controlled benchmark
        run: >-
          node scripts/benchmark-whisper-cpu.mjs
          --sidecar-version "$SIDECAR_VERSION"
          --output-dir artifacts/whisper-cpu-rca

      - name: Upload compact diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whisper-cpu-rca-${{ env.SIDECAR_VERSION }}-${{ github.run_id }}
          path: |
            artifacts/whisper-cpu-rca/report.json
            artifacts/whisper-cpu-rca/report.md
            artifacts/whisper-cpu-rca/stderr/*.log
          if-no-files-found: warn
          retention-days: 14
