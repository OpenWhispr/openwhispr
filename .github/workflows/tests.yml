name: Tests

on:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # --ignore-scripts skips better-sqlite3's install script, so its native
      # binding is never built and every database test would fail to load it.
      - name: Build the better-sqlite3 native binding
        run: npm rebuild better-sqlite3
      - name: Run tests
        run: npm test
        env:
          # keeps require("electron") from throwing when postinstall was skipped
          ELECTRON_OVERRIDE_DIST_PATH: /tmp
