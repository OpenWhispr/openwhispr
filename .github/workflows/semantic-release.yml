name: Semantic Release

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyze Conventional Commits without creating a tag or draft release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: semantic-release-main
  cancel-in-progress: false

env:
  DISTRIBUTION_MANIFEST: ${{ vars.RELEASE_DISTRIBUTION_MANIFEST || 'distributions/oppulence-voice.json' }}
  RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  RELEASE_PRODUCT_NAME: ${{ vars.RELEASE_PRODUCT_NAME || 'Oppulence Voice' }}
  RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID || 'engineering.oppulence.voice' }}
  RELEASE_PROTOCOL_SCHEME: ${{ vars.RELEASE_PROTOCOL_SCHEME || 'oppulence-voice' }}
  RELEASE_ALLOW_UNSIGNED: ${{ vars.RELEASE_ALLOW_UNSIGNED || 'true' }}

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    name: Analyze commits and dispatch signed release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.result.outputs.released }}
      version: ${{ steps.result.outputs.version }}
      tag: ${{ steps.result.outputs.tag }}

    steps:
      - name: Checkout full release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the current main commit
        id: current
        run: |
          git fetch --no-tags origin main
          MAIN_SHA=$(git rev-parse origin/main)
          if [ "$RELEASE_SHA" != "$MAIN_SHA" ]; then
            echo "::notice::Skipping stale main run for $RELEASE_SHA; current main is $MAIN_SHA."
            echo "is_current=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.current.outputs.is_current == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/semantic-release/package-lock.json

      - name: Require passing tests for a manual release
        if: steps.current.outputs.is_current == 'true' && github.event_name == 'workflow_dispatch' && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TEST_RUN=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow tests.yml \
            --commit "$RELEASE_SHA" \
            --event push \
            --limit 1 \
            --json databaseId,status,conclusion \
            --jq '.[0]')
          if [ -z "$TEST_RUN" ] || [ "$TEST_RUN" = "null" ]; then
            echo "::error::No Tests workflow run exists for $RELEASE_SHA."
            exit 1
          fi
          TEST_STATUS=$(jq -r .status <<< "$TEST_RUN")
          TEST_CONCLUSION=$(jq -r .conclusion <<< "$TEST_RUN")
          TEST_RUN_ID=$(jq -r .databaseId <<< "$TEST_RUN")
          if [ "$TEST_STATUS" != "completed" ] || [ "$TEST_CONCLUSION" != "success" ]; then
            echo "::error::Tests run $TEST_RUN_ID for $RELEASE_SHA did not pass ($TEST_STATUS/$TEST_CONCLUSION)."
            exit 1
          fi
          echo "Tests run $TEST_RUN_ID passed for $RELEASE_SHA."

      - name: Install pinned semantic-release tooling
        if: steps.current.outputs.is_current == 'true'
        run: npm ci --prefix .github/semantic-release --ignore-scripts --no-audit --no-fund

      - name: Stage generated release commit outside protected main
        id: branch
        if: >-
          steps.current.outputs.is_current == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
        run: |
          RELEASE_BRANCH="semantic-release/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$RELEASE_BRANCH"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          echo "name=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Analyze Conventional Commits and prepare release
        if: steps.current.outputs.is_current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          SEMANTIC_RELEASE_BRANCH: ${{ steps.branch.outputs.name || 'main' }}
        run: |
          args=(--extends ./.github/semantic-release/release.config.cjs)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          node .github/semantic-release/run.cjs "${args[@]}"

      - name: Detect created semantic release
        id: result
        if: steps.current.outputs.is_current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_TAG=$(git tag --points-at HEAD --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$RELEASE_TAG" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No release-worthy Conventional Commits were found."
            exit 0
          fi

          RELEASE_VERSION=${RELEASE_TAG#v}
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Semantic tag $RELEASE_TAG does not match package version $PACKAGE_VERSION."
            exit 1
          fi

          RELEASE_IS_DRAFT=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$RELEASE_IS_DRAFT" != "true" ]; then
            echo "::error::Semantic release $RELEASE_TAG must be a draft until signed artifacts finish."
            exit 1
          fi

          {
            echo "released=true"
            echo "version=$RELEASE_VERSION"
            echo "tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Open protected release pull request
        id: release_pr
        if: steps.result.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          RELEASE_BRANCH: ${{ steps.branch.outputs.name }}
          RELEASE_VERSION: ${{ steps.result.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_PR_TOKEN is required because organization policy blocks GITHUB_TOKEN pull request creation."
            exit 1
          fi
          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "chore(release): $RELEASE_VERSION" \
            --body "Automated semantic-release metadata update. This pull request must pass the required Tests workflow before protected main can advance.")
          PR_NUMBER=$(gh pr view "$PR_URL" --repo "$GITHUB_REPOSITORY" --json number --jq .number)
          {
            echo "number=$PR_NUMBER"
            echo "url=$PR_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Require Tests on the generated release commit
        id: generated_tests
        if: steps.result.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          PR_NUMBER: ${{ steps.release_pr.outputs.number }}
          RELEASE_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          GENERATED_SHA=$(git rev-parse HEAD)
          if [ "$(git rev-parse HEAD^)" != "$RELEASE_SHA" ]; then
            echo "::error::Generated release commit is not based directly on tested main $RELEASE_SHA."
            exit 1
          fi

          TEST_RUN_ID=""
          for attempt in $(seq 1 30); do
            TEST_RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow tests.yml \
              --branch "$RELEASE_BRANCH" \
              --event pull_request \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$GENERATED_SHA\") | .databaseId" \
              | head -n1)
            if [ -n "$TEST_RUN_ID" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$TEST_RUN_ID" ]; then
            echo "::error::Tests workflow did not start for generated release commit $GENERATED_SHA."
            exit 1
          fi

          gh run watch "$TEST_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          for attempt in $(seq 1 30); do
            PR_TEST_RESULT=$(gh pr view "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json statusCheckRollup \
              --jq '[.statusCheckRollup[] | select(.name == "pr-quality" and .workflowName == "Tests")][-1].conclusion // empty')
            if [ "$PR_TEST_RESULT" = "SUCCESS" ]; then
              break
            fi
            sleep 2
          done
          if [ "$PR_TEST_RESULT" != "SUCCESS" ]; then
            echo "::error::Generated Tests run $TEST_RUN_ID was not attached to release PR #$PR_NUMBER."
            exit 1
          fi
          echo "Generated release commit $GENERATED_SHA passed Tests run $TEST_RUN_ID."
          {
            echo "sha=$GENERATED_SHA"
            echo "run_id=$TEST_RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Merge the tested release commit through protected main
        if: steps.result.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          GENERATED_SHA: ${{ steps.generated_tests.outputs.sha }}
          PR_NUMBER: ${{ steps.release_pr.outputs.number }}
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" != "$RELEASE_SHA" ]; then
            echo "::error::Main moved after release analysis; refusing to overwrite it."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --merge --delete-branch
          for attempt in $(seq 1 60); do
            PR_STATE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
            if [ "$PR_STATE" = "MERGED" ]; then
              break
            fi
            sleep 5
          done
          if [ "$PR_STATE" != "MERGED" ]; then
            echo "::error::Release PR #$PR_NUMBER did not merge after its required checks passed."
            exit 1
          fi
          git fetch --no-tags origin main
          MAIN_SHA=$(git rev-parse origin/main)
          if ! git merge-base --is-ancestor "$GENERATED_SHA" "$MAIN_SHA"; then
            echo "::error::Protected main $MAIN_SHA does not contain tested release commit $GENERATED_SHA."
            exit 1
          fi

      - name: Dispatch signed multi-platform release
        if: steps.result.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.result.outputs.tag }}
          RELEASE_VERSION: ${{ steps.result.outputs.version }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run release.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$RELEASE_TAG" \
              -f version="$RELEASE_VERSION" \
              -f product_name="$RELEASE_PRODUCT_NAME" \
              -f app_id="$RELEASE_APP_ID" \
              -f protocol_scheme="$RELEASE_PROTOCOL_SCHEME" \
              -f publish_release=true \
              -f allow_unsigned_release="$RELEASE_ALLOW_UNSIGNED" \
              -f validate_only=false \
              -f reuse_semantic_release=true; then
              echo "Dispatched signed release workflow for $RELEASE_TAG."
              exit 0
            fi
            echo "Dispatch attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Remove incomplete semantic release
        if: failure() && steps.result.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.result.outputs.tag }}
        run: gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

      - name: Close incomplete release pull request
        if: failure() && steps.release_pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          PR_NUMBER: ${{ steps.release_pr.outputs.number }}
        run: gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --delete-branch || true

      - name: Remove temporary release branch
        if: always() && steps.branch.outputs.name != ''
        env:
          RELEASE_BRANCH: ${{ steps.branch.outputs.name }}
        run: git push origin --delete "$RELEASE_BRANCH" || true
