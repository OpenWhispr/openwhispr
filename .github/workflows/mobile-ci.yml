name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  EXPO_NO_DOTENV: "1"
  SENTRY_DISABLE_AUTO_UPLOAD: "true"

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  lockfile:
    name: Mobile lockfile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: openwhispr-mobile/.nvmrc
      # Validate before installing packages from the contributor's lockfile.
      - name: Validate dependency sources and integrity
        run: npx --yes --ignore-scripts --package=lockfile-lint@5.0.1 lockfile-lint --path openwhispr-mobile/package-lock.json --type npm --validate-https --allowed-hosts npm --validate-integrity
      - name: Reject high and critical dependency advisories
        working-directory: openwhispr-mobile
        run: npx --yes --ignore-scripts --package=audit-ci@7.1.0 audit-ci --config audit-ci.json

  checks:
    name: Mobile ${{ matrix.check }}
    needs: [changes, lockfile]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [static, tests, bundles]
    defaults:
      run:
        working-directory: openwhispr-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: openwhispr-mobile/.nvmrc
          cache: npm
          cache-dependency-path: openwhispr-mobile/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply reviewed dependency patches
        run: node_modules/.bin/patch-package --error-on-fail
      - name: Verify dependency security regressions
        run: npm run test:security
      - name: Test the Android isolation check
        if: matrix.check == 'static'
        run: npm run test:android-ui-isolation
      - name: Check formatting
        if: matrix.check == 'static'
        run: npm run format
      - name: Lint
        if: matrix.check == 'static'
        run: npm run lint
      - name: Typecheck
        if: matrix.check == 'static'
        run: npm run typecheck
      - name: Check Expo dependencies and configuration
        if: matrix.check == 'static'
        run: npm run doctor
      - name: Validate development and production app configuration
        if: matrix.check == 'static'
        run: |
          OPENWHISPR_APP_ENV=development node_modules/.bin/expo config --type public > /dev/null
          OPENWHISPR_APP_ENV=production node_modules/.bin/expo config --type public > /dev/null
      - name: Build SQLite test binding
        if: matrix.check == 'tests'
        run: npm rebuild better-sqlite3
      - name: Run tests
        if: matrix.check == 'tests'
        run: npm run test --ignore-scripts -- --ci --runInBand
      - name: Bundle iOS
        if: matrix.check == 'bundles'
        run: node_modules/.bin/expo export --platform ios --source-maps --max-workers 2 --output-dir "$RUNNER_TEMP/mobile-export"
        env:
          OPENWHISPR_APP_ENV: production
      # A JS bundle is the cheapest Android check: no SDK, emulator, or signing.
      # Native Android build/release validation stays deferred.
      - name: Bundle Android
        if: matrix.check == 'bundles'
        run: node_modules/.bin/expo export --platform android --max-workers 2 --output-dir "$RUNNER_TEMP/mobile-export-android"
        env:
          OPENWHISPR_APP_ENV: production

  # Android and iOS stay apart (scripts/check-android-ui-isolation.mjs): nothing from Android goes
  # into iOS and nothing from iOS into Android. The fork point is where android/beta left main.
  isolation:
    name: Mobile isolation
    needs: [changes, lockfile]
    if: needs.changes.outputs.mobile == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: openwhispr-mobile
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      OPENWHISPR_APP_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch main for the fork point
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: openwhispr-mobile/.nvmrc
          cache: npm
          cache-dependency-path: openwhispr-mobile/package-lock.json
      - name: Test the isolation check
        run: npm run test:android-ui-isolation
      # Into android/beta: a file of main's tree changes only back to its fork-point content, and
      # new files go under Android-only paths. Into main: no Android-only file changes.
      - name: Keep files on their own side
        run: node scripts/check-android-ui-isolation.mjs files --base "$BASE_SHA" --target "$BASE_REF"
      - name: Find the fork point with main
        if: startsWith(github.event.pull_request.base.ref, 'android/')
        id: fork
        run: echo "sha=$(git merge-base origin/main HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install locked dependencies without lifecycle scripts
        if: startsWith(github.event.pull_request.base.ref, 'android/')
        run: npm ci --ignore-scripts --no-audit --no-fund && node_modules/.bin/patch-package --error-on-fail
      - name: Bundle iOS as plain JS
        if: startsWith(github.event.pull_request.base.ref, 'android/')
        run: node_modules/.bin/expo export --platform ios --no-bytecode --source-maps --max-workers 2 --output-dir "$RUNNER_TEMP/ios-head"
      - name: Fingerprint the iOS app
        if: startsWith(github.event.pull_request.base.ref, 'android/')
        run: node scripts/check-android-ui-isolation.mjs fingerprint --project . --export-dir "$RUNNER_TEMP/ios-head" --out "$RUNNER_TEMP/ios-head.json"
      # The fork point's fingerprint only changes when the fork point or the fingerprint code does.
      - name: Restore the fork point's iOS fingerprint
        if: startsWith(github.event.pull_request.base.ref, 'android/')
        id: fork-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ios-fork.json
          key: ios-fork-fingerprint-${{ steps.fork.outputs.sha }}-${{ hashFiles('openwhispr-mobile/scripts/check-android-ui-isolation.mjs') }}
      - name: Fingerprint the iOS app at the fork point
        if: startsWith(github.event.pull_request.base.ref, 'android/') && steps.fork-cache.outputs.cache-hit != 'true'
        env:
          FORK_SHA: ${{ steps.fork.outputs.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/fork" "$FORK_SHA"
          cd "$RUNNER_TEMP/fork/openwhispr-mobile"
          npm ci --ignore-scripts --no-audit --no-fund
          node_modules/.bin/patch-package --error-on-fail
          node_modules/.bin/expo export --platform ios --no-bytecode --source-maps --max-workers 2 --output-dir "$RUNNER_TEMP/ios-fork"
          node "$GITHUB_WORKSPACE/openwhispr-mobile/scripts/check-android-ui-isolation.mjs" fingerprint --project . --export-dir "$RUNNER_TEMP/ios-fork" --out "$RUNNER_TEMP/ios-fork.json"
      # Every difference from main's iOS app must be listed in scripts/android-ios-known-ios-diffs.json,
      # and listed ones that are gone must be removed. The list only shrinks.
      - name: Keep the iOS app as main has it
        if: startsWith(github.event.pull_request.base.ref, 'android/')
        run: node scripts/check-android-ui-isolation.mjs compare-ios --head "$RUNNER_TEMP/ios-head.json" --fork "$RUNNER_TEMP/ios-fork.json"
      - name: Bundle Android with source maps
        if: startsWith(github.event.pull_request.base.ref, 'android/')
        run: node_modules/.bin/expo export --platform android --source-maps --max-workers 2 --output-dir "$RUNNER_TEMP/android-head"
      # Android must end up loading no file iOS loads. scripts/android-ios-shared-baseline.txt lists
      # the ones it still does; the list only shrinks.
      - name: Keep Android off files iOS loads
        if: startsWith(github.event.pull_request.base.ref, 'android/')
        run: node scripts/check-android-ui-isolation.mjs shared --ios-export "$RUNNER_TEMP/ios-head" --android-export "$RUNNER_TEMP/android-head"

  native-transport:
    name: Mobile native Swift tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    # Compiles native Swift sources and their tests, which need Xcode's toolchain (the keyboard's UIKit tests build for Mac Catalyst).
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run background upload recovery tests
        run: python3 openwhispr-mobile/modules/background-uploader/tests/run-background-recovery-tests.py
      - name: Run native provider transport tests
        run: python3 openwhispr-mobile/modules/background-uploader/tests/run-provider-transport-tests.py
      - name: Run keyboard return resolver tests
        run: bash openwhispr-mobile/modules/app-group-storage/tests/run-return-target-tests.sh
      - name: Run keyboard recording startup tests
        run: python3 openwhispr-mobile/modules/app-group-storage/tests/run-recording-startup-tests.py
      - name: Run hotkey dictation logic tests
        run: python3 openwhispr-mobile/plugins/hotkey-dictation/tests/run-hotkey-logic-tests.py
      - name: Run Live Activity resolver tests
        run: sh openwhispr-mobile/modules/live-activity/tests/run-resolver-tests.sh
      - name: Run keyboard touch routing tests
        run: python3 openwhispr-mobile/plugins/keyboard-extension/tests/run-keyboard-touch-tests.py
      - name: Run keyboard capitalization tests
        run: sh openwhispr-mobile/scripts/test-keyboard-capitalization.sh

  mobile-status:
    name: Mobile CI
    needs: [changes, lockfile, checks, isolation, native-transport]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all selected mobile checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MOBILE: ${{ needs.changes.outputs.mobile }}
          LOCKFILE_RESULT: ${{ needs.lockfile.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          ISOLATION_RESULT: ${{ needs.isolation.result }}
          EVENT: ${{ github.event_name }}
          NATIVE_TRANSPORT_RESULT: ${{ needs.native-transport.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$MOBILE" = true ]; then
            test "$LOCKFILE_RESULT" = success
            test "$CHECKS_RESULT" = success
            if [ "$EVENT" = pull_request ]; then test "$ISOLATION_RESULT" = success; fi
            test "$NATIVE_TRANSPORT_RESULT" = success
          fi
