name: Bug report
description: Report reproducible behavior that is wrong
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first,
        and include the exact steps, version, and OS so the report can be reproduced.
  - type: textarea
    id: what-happened
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To reproduce
      description: Numbered steps someone else can follow on a clean checkout.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen? Quote the docs or previous behavior if possible.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: The error, wrong screen, or silent no-op. Redact secrets and personal data.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 23H2 / macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      description: "Do not write 'latest'. Use the About screen or git rev-parse HEAD."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the last 20-40 lines that name this repo's files.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Browser, mobile device, screenshots, or anything else that helps.
