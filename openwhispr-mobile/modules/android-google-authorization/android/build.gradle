apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
group = 'com.openwhispr.googleauth'
version = '1.0.0'
android {
  namespace 'com.openwhispr.googleauth'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}
dependencies {
  // AuthorizationClient: Google's supported Android OAuth path (custom URI redirects are refused).
  implementation 'com.google.android.gms:play-services-auth:22.0.0'
  // Credential Manager's "Sign in with Google" sheet, for signing in to OpenWhispr itself.
  implementation 'androidx.credentials:credentials:1.3.0'
  implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
  implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
